<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GANADOR | Discipline & Rebirth</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A0F1C">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-orange: #FF6B00;
            --accent-cyan: #00FFFF;
            --bg-dark: #0A0F1C;
            --bg-light: #FFFFFF;
            --transition-speed: 500ms;
            
            /* Timing Constants (ms) */
            --scene-1-dur: 1500ms;
            --trans-1-dur: 500ms;
            --scene-2-dur: 1000ms;
            --trans-2-dur: 200ms;
            --scene-3-dur: 800ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
        }

        /* --- 1. CINEMATIC SPLASH SCREEN --- */
        #splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .splash-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity var(--trans-1-dur) ease-in-out;
        }

        /* Act 1: The Embers (0-1.5s) */
        #scene-embers {
            background-image: url('1000044617.jpg'); /* PLACEHOLDER: Molten Background */
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.5);
            transform: scale(1.2);
            animation: kenBurns var(--scene-1-dur) forwards linear;
        }

        @keyframes kenBurns {
            to { transform: scale(1); filter: blur(2px) brightness(0.7); }
        }

        /* Act 2: The Rebirth (1.5-3.0s) */
        #scene-rebirth img {
            width: 80vw;
            max-width: 400px;
            filter: drop-shadow(0 0 20px var(--primary-orange));
            animation: flareUp 1s infinite alternate;
        }

        @keyframes flareUp {
            from { filter: drop-shadow(0 0 10px var(--primary-orange)) brightness(1); }
            to { filter: drop-shadow(0 0 40px var(--primary-orange)) brightness(1.3); }
        }

        /* Act 3: The Ganador + God Rays (3.2-4.0s) */
        #scene-ganador {
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
        }

        .ganador-logo-wrapper {
            position: relative;
            width: 85vw;
            max-width: 500px;
        }

        .ganador-logo-wrapper img {
            width: 100%;
            position: relative;
            z-index: 2;
        }

        /* Pure CSS God Ray Effect */
        .god-rays {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(255, 107, 0, 0.2) 10%,
                transparent 20%,
                rgba(0, 255, 255, 0.1) 40%,
                transparent 50%
            );
            transform: translate(-50%, -50%);
            animation: rotateRays 4s linear infinite;
            z-index: 1;
        }

        @keyframes rotateRays {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* --- 2. THE APP SHELL --- */
        #app-shell {
            display: none; /* Hidden during splash */
            height: 100vh;
            flex-direction: column;
            background: var(--bg-dark);
            color: white;
        }

        /* Premium Login Screen */
        #login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--bg-light) 50%, var(--primary-orange) 50.1%);
            color: var(--bg-dark);
        }

        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h1 { font-weight: 900; font-size: 2rem; margin-bottom: 0.5rem; color: var(--primary-orange); }
        
        .btn-premium {
            background: var(--primary-orange);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            margin-top: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        /* Bottom Navigation (5-Tabs) */
        .bottom-nav {
            height: 70px;
            background: rgba(10, 15, 28, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            color: #666;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
        }

        .nav-item.active { color: var(--primary-orange); }
        .nav-item span { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }

        /* Utility */
        .visible { opacity: 1 !important; }
    </style>
</head>
<body>

</html>
