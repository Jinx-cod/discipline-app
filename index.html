<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime - Daily Discipline</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta name="theme-color" content="#7C3AED">
</head>
<body>
    <header>
        <h1>PRIME</h1>
        <div class="date" id="currentDate"></div>
    </header>

    <!-- HABIT TRACKER SECTION -->
    <div class="section-title">🔥 Today's Habits</div>
    <div class="habit-list" id="habitList"></div>

    <!-- MOTIVATION QUOTE -->
    <div class="quote-card" id="quoteCard">
        <div class="quote-text" id="quoteText">"The only bad workout is the one that didn't happen."</div>
        <div class="quote-author" id="quoteAuthor">– Unknown</div>
    </div>

    <!-- FOCUS TIMER -->
    <div class="section-title">⏱️ Focus Timer</div>
    <div class="timer-section">
        <div class="timer-display" id="timer">25:00</div>
        <div class="timer-controls">
            <button class="btn" id="startTimer">Start</button>
            <button class="btn btn-secondary" id="pauseTimer">Pause</button>
            <button class="btn btn-danger" id="resetTimer">Reset</button>
        </div>
    </div>

    <!-- QUICK MOTIVATION BUTTON -->
    <button class="btn motivation-btn" id="motivationBtn">
        <i class="fas fa-bolt"></i> Need Motivation?
    </button>

    <!-- AD SPACE -->
    <div class="ad-banner" id="adSpace">
        📢 Your ad could be here – support Prime!
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav>
        <a href="#" class="nav-item active" data-section="home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" data-section="stats">
            <i class="fas fa-chart-line"></i>
            <span>Stats</span>
        </a>
        <a href="#" class="nav-item" data-section="settings">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </a>
    </nav>

    <script>
        // ========== APP STATE ==========
        let habits = [
            { name: "Morning Workout", completed: false, streak: 0 },
            { name: "Read 10 Pages", completed: false, streak: 0 },
            { name: "Meditate", completed: false, streak: 0 }
        ];

        let timerInterval = null;
        let timerSeconds = 25 * 60; // 25 minutes
        let timerRunning = false;
        let currentSection = 'home';

        const quotes = [
            { text: "Discipline is choosing what you want now for what you want most.", author: "Unknown" },
            { text: "You don't have to be extreme, just consistent.", author: "James Clear" },
            { text: "Small disciplines repeated daily lead to great achievements.", author: "John Maxwell" },
            { text: "The pain of discipline weighs ounces; regret weighs tons.", author: "Jim Rohn" },
            { text: "Motivation gets you started. Discipline keeps you going.", author: "Unknown" }
        ];

        // ========== INITIALIZE ==========
        document.addEventListener('DOMContentLoaded', () => {
            updateDate();
            loadSavedData();
            renderHabits();
            updateTimerDisplay();
            setDailyQuote();
            setupEventListeners();
            
            // Register service worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js')
                    .catch(err => console.log('SW error:', err));
            }
        });

        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = 
                new Date().toLocaleDateString('en-US', options);
        }

        function loadSavedData() {
            const saved = localStorage.getItem('primeHabits');
            if (saved) {
                habits = JSON.parse(saved);
            }
        }

        function saveData() {
            localStorage.setItem('primeHabits', JSON.stringify(habits));
        }

        // ========== HABIT TRACKER ==========
        function renderHabits() {
            const habitList = document.getElementById('habitList');
            habitList.innerHTML = habits.map((habit, index) => `
                <div class="habit-item">
                    <label style="display: flex; align-items: center; gap: 12px;">
                        <input type="checkbox" class="habit-check" 
                            ${habit.completed ? 'checked' : ''} 
                            onchange="toggleHabit(${index})">
                        <span style="${habit.completed ? 'opacity: 0.6; text-decoration: line-through;' : ''}">
                            ${habit.name}
                        </span>
                    </label>
                    <span class="streak">${habit.streak}</span>
                </div>
            `).join('');
        }

        window.toggleHabit = function(index) {
            habits[index].completed = !habits[index].completed;
            
            if (habits[index].completed) {
                habits[index].streak += 1;
            } else {
                habits[index].streak = Math.max(0, habits[index].streak - 1);
            }
            
            saveData();
            renderHabits();
        };

        // ========== TIMER ==========
        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timer').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    // Timer finished
                    clearInterval(timerInterval);
                    timerRunning = false;
                    alert("✅ Time's up! Great work.");
                    // Optional: play sound or notification
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerRunning = false;
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 25 * 60;
            updateTimerDisplay();
        }

        document.getElementById('startTimer').addEventListener('click', startTimer);
        document.getElementById('pauseTimer').addEventListener('click', pauseTimer);
        document.getElementById('resetTimer').addEventListener('click', resetTimer);

        // ========== MOTIVATION ==========
        function setDailyQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById('quoteText').textContent = `"${quotes[randomIndex].text}"`;
            document.getElementById('quoteAuthor').textContent = `– ${quotes[randomIndex].author}`;
        }

        document.getElementById('motivationBtn').addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById('quoteText').textContent = `"${quotes[randomIndex].text}"`;
            document.getElementById('quoteAuthor').textContent = `– ${quotes[randomIndex].author}`;
            
            // Add micro-interaction
            const btn = document.getElementById('motivationBtn');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => btn.style.transform = 'scale(1)', 200);
        });

        // ========== NAVIGATION ==========
        function setupEventListeners() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    // Update active class
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    item.classList.add('active');
                    
                    // Here you'd handle showing different sections
                    // For V1, we'll just log
                    console.log('Navigate to:', item.dataset.section);
                });
            });
        }

        // ========== MICRO-INTERACTIONS ==========
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.style.transform = 'scale(0.95)');
            btn.addEventListener('mouseup', () => btn.style.transform = 'scale(1)');
            btn.addEventListener('mouseleave', () => btn.style.transform = 'scale(1)');
        });
    </script>
</body>
</html>
