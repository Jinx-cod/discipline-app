<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime - Daily Discipline</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
</head>
<body>
    <header class="header">
        <h1>PRIME</h1>
        <p class="quote" id="quote">Loading motivation...</p>
    </header>

    <!-- USER SECTION (LOGIN/LOGOUT) -->
    <div id="userSection" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding: 0 1rem;">
        <div id="userInfo">
            <span id="userName">Guest</span>
        </div>
        <button id="loginBtn" class="btn-primary" style="width: auto; margin: 0; padding: 0.5rem 1rem;">Sign in with Google</button>
        <button id="logoutBtn" class="btn-primary" style="width: auto; margin: 0; padding: 0.5rem 1rem; display: none;">Logout</button>
    </div>

    <main>
        <section class="habits">
            <h2>Today's Habits</h2>
            <div class="habit-grid" id="habitGrid"></div>
        </section>

        <section class="focus">
            <h2>Focus Session</h2>
            <div class="timer-circle" id="timerCircle">
                <span id="timer">25:00</span>
            </div>
            <div class="timer-controls">
                <button id="startTimer" class="btn-primary">Start</button>
                <button id="pauseTimer" class="btn-primary">Pause</button>
                <button id="resetTimer" class="btn-primary">Reset</button>
            </div>
        </section>

        <button id="feeling-down" class="btn-primary">Feeling down? 💙</button>
    </main>

    <footer>
        <small>Streak 🔥 powered by discipline</small>
    </footer>

    <!-- ===== SCRIPT 1: FIREBASE INIT ===== -->
    <script type="module">
        // Import Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBSc0D-K1Ciw9V4bGEKNPSpQZ1pOFkYUMU",
            authDomain: "prime-app-516e1.firebaseapp.com",
            projectId: "prime-app-516e1",
            storageBucket: "prime-app-516e1.firebasestorage.app",
            messagingSenderId: "451478170334",
            appId: "1:451478170334:web:1aa1099ea3ab9c4facb04f"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Make available globally
        window.auth = auth;
        window.db = db;
        window.provider = provider;
        window.signInWithPopup = signInWithPopup;
        window.signOut = signOut;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;

        console.log("🔥 Firebase ready");
    </script>

    <!-- ===== SCRIPT 2: APP LOGIC (Habits, Timer, etc) ===== -->
    <script>
        // ========== APP STATE ==========
        let habits = [
            { name: "Morning Workout", completed: false, streak: 0 },
            { name: "Read 10 Pages", completed: false, streak: 0 },
            { name: "Meditate", completed: false, streak: 0 }
        ];

        let timerInterval = null;
        let timerSeconds = 25 * 60;
        let timerRunning = false;
        let currentUser = null;

        const quotes = [
            "Discipline is choosing between what you want now and what you want most.",
            "Small disciplines repeated daily lead to great achievements.",
            "The pain of discipline weighs ounces; regret weighs tons.",
            "You don't have to be extreme, just consistent.",
            "Motivation gets you started. Discipline keeps you going."
        ];

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            renderHabits();
            updateTimerDisplay();
            setDailyQuote();
            setupEventListeners();
            setupFirebaseListeners();
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js');
            }
        });

        function loadSavedData() {
            const saved = localStorage.getItem('primeHabits');
            if (saved) habits = JSON.parse(saved);
        }

        function saveData() {
            localStorage.setItem('primeHabits', JSON.stringify(habits));
            // If logged in, also save to cloud
            if (currentUser) {
                saveToCloud();
            }
        }

        // ========== FIREBASE AUTH ==========
        function setupFirebaseListeners() {
            // Login button
            document.getElementById('loginBtn').addEventListener('click', async () => {
                try {
                    const result = await window.signInWithPopup(window.auth, window.provider);
                    currentUser = result.user;
                    document.getElementById('userName').textContent = currentUser.displayName || 'User';
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('logoutBtn').style.display = 'block';
                    
                    // Load user's cloud data
                    await loadFromCloud();
                    renderHabits();
                } catch (error) {
                    console.error('Login error:', error);
                }
            });

            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await window.signOut(window.auth);
                currentUser = null;
                document.getElementById('userName').textContent = 'Guest';
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'none';
                
                // Reload local data
                loadSavedData();
                renderHabits();
            });
        }

        // ========== CLOUD SYNC ==========
        async function saveToCloud() {
            if (!currentUser) return;
            
            const userDoc = window.doc(window.db, 'users', currentUser.uid);
            await window.setDoc(userDoc, {
                habits: habits,
                lastActive: new Date().toISOString(),
                email: currentUser.email
            }, { merge: true });
            
            console.log('Saved to cloud');
        }

        async function loadFromCloud() {
            if (!currentUser) return;
            
            const userDoc = window.doc(window.db, 'users', currentUser.uid);
            const docSnap = await window.getDoc(userDoc);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.habits) {
                    habits = data.habits;
                    saveData(); // Update local storage
                }
                console.log('Loaded from cloud');
            }
        }

        // ========== HABITS ==========
        function renderHabits() {
            const grid = document.getElementById('habitGrid');
            if (!grid) return;
            
            grid.innerHTML = habits.map((habit, index) => `
                <div class="habit-card">
                    <span class="habit-name">${habit.name}</span>
                    <div class="streak ${habit.streak > 0 ? 'fire' : ''}">
                        ${habit.streak}
                    </div>
                    <button class="check-btn ${habit.completed ? 'completed' : ''}" 
                            onclick="toggleHabit(${index})">
                        ✓
                    </button>
                </div>
            `).join('');
        }

        window.toggleHabit = function(index) {
            habits[index].completed = !habits[index].completed;
            
            if (habits[index].completed) {
                habits[index].streak += 1;
                const cards = document.querySelectorAll('.habit-card');
                if (cards[index]) {
                    cards[index].style.transform = 'scale(1.05)';
                    setTimeout(() => {
                        cards[index].style.transform = 'scale(1)';
                    }, 200);
                }
            } else {
                habits[index].streak = Math.max(0, habits[index].streak - 1);
            }
            
            saveData();
            renderHabits();
        };

        // ========== TIMER ==========
        function updateTimerDisplay() {
            const timerEl = document.getElementById('timer');
            if (!timerEl) return;
            
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            const circle = document.getElementById('timerCircle');
            if (circle) {
                const progress = ((25*60 - timerSeconds) / (25*60)) * 360;
                circle.style.background = `conic-gradient(var(--accent) ${progress}deg, var(--gray) ${progress}deg)`;
            }
        }

        document.getElementById('startTimer')?.addEventListener('click', () => {
            if (timerRunning) return;
            timerRunning = true;
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    alert("✅ Time's up! Great work.");
                }
            }, 1000);
        });

        document.getElementById('pauseTimer')?.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
        });

        document.getElementById('resetTimer')?.addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
            timerSeconds = 25 * 60;
            updateTimerDisplay();
        });

        // ========== MOTIVATION ==========
        function setDailyQuote() {
            const quoteEl = document.getElementById('quote');
            if (!quoteEl) return;
            
            const random = Math.floor(Math.random() * quotes.length);
            quoteEl.textContent = `"${quotes[random]}"`;
        }

        document.getElementById('feeling-down')?.addEventListener('click', () => {
            const random = Math.floor(Math.random() * quotes.length);
            const quoteEl = document.getElementById('quote');
            if (quoteEl) {
                quoteEl.textContent = `"${quotes[random]}"`;
            }
            
            const btn = document.getElementById('feeling-down');
            if (btn) {
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => btn.style.transform = 'scale(1)', 200);
            }
        });

        // ========== MICRO-INTERACTIONS ==========
        function setupEventListeners() {
            document.querySelectorAll('.btn-primary').forEach(btn => {
                btn.addEventListener('mousedown', () => btn.style.transform = 'scale(0.95)');
                btn.addEventListener('mouseup', () => btn.style.transform = 'scale(1)');
                btn.addEventListener('mouseleave', () => btn.style.transform = 'scale(1)');
            });
        }
    </script>
</body>
</html>
