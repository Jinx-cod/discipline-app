<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime - Daily Discipline</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
</head>
<body>
    <header class="header">
        <h1>PRIME</h1>
        <p class="quote" id="quote">Loading motivation...</p>
    </header>

    <main>
        <section class="habits">
            <h2>Today's Habits</h2>
            <div class="habit-grid" id="habitGrid"></div>
        </section>

        <section class="focus">
            <h2>Focus Session</h2>
            <div class="timer-circle" id="timerCircle">
                <span id="timer">25:00</span>
            </div>
            <div class="timer-controls">
                <button id="startTimer" class="btn-primary">Start</button>
                <button id="pauseTimer" class="btn-primary">Pause</button>
                <button id="resetTimer" class="btn-primary">Reset</button>
            </div>
        </section>

        <button id="feeling-down" class="btn-primary">Feeling down? 💙</button>
    </main>

    <footer>
        <small>Streak 🔥 powered by discipline</small>
    </footer>

    <script>
        // ========== APP STATE ==========
        let habits = [
            { name: "Morning Workout", completed: false, streak: 0 },
            { name: "Read 10 Pages", completed: false, streak: 0 },
            { name: "Meditate", completed: false, streak: 0 }
        ];

        let timerInterval = null;
        let timerSeconds = 25 * 60;
        let timerRunning = false;

        const quotes = [
            "Discipline is choosing between what you want now and what you want most.",
            "Small disciplines repeated daily lead to great achievements.",
            "The pain of discipline weighs ounces; regret weighs tons.",
            "You don't have to be extreme, just consistent.",
            "Motivation gets you started. Discipline keeps you going."
        ];

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            renderHabits();
            updateTimerDisplay();
            setDailyQuote();
            setupEventListeners();
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js');
            }
        });

        function loadSavedData() {
            const saved = localStorage.getItem('primeHabits');
            if (saved) habits = JSON.parse(saved);
        }

        function saveData() {
            localStorage.setItem('primeHabits', JSON.stringify(habits));
        }

        // ========== HABITS ==========
        function renderHabits() {
            const grid = document.getElementById('habitGrid');
            grid.innerHTML = habits.map((habit, index) => `
                <div class="habit-card">
                    <span class="habit-name">${habit.name}</span>
                    <div class="streak ${habit.streak > 0 ? 'fire' : ''}">
                        ${habit.streak}
                    </div>
                    <button class="check-btn ${habit.completed ? 'completed' : ''}" 
                            onclick="toggleHabit(${index})">
                        ✓
                    </button>
                </div>
            `).join('');
        }

        window.toggleHabit = function(index) {
            habits[index].completed = !habits[index].completed;
            
            if (habits[index].completed) {
                habits[index].streak += 1;
                // Optional confetti effect
                document.querySelectorAll('.habit-card')[index].style.transform = 'scale(1.05)';
                setTimeout(() => {
                    document.querySelectorAll('.habit-card')[index].style.transform = 'scale(1)';
                }, 200);
            } else {
                habits[index].streak = Math.max(0, habits[index].streak - 1);
            }
            
            saveData();
            renderHabits();
        };

        // ========== TIMER ==========
        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timer').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            // Update circle progress
            const progress = ((25*60 - timerSeconds) / (25*60)) * 360;
            document.getElementById('timerCircle').style.background = 
                `conic-gradient(var(--accent) ${progress}deg, var(--gray) ${progress}deg)`;
        }

        document.getElementById('startTimer').addEventListener('click', () => {
            if (timerRunning) return;
            timerRunning = true;
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    alert("✅ Time's up! Great work.");
                }
            }, 1000);
        });

        document.getElementById('pauseTimer').addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
        });

        document.getElementById('resetTimer').addEventListener('click', () => {
            clearInterval(timerInterval);
            timerRunning = false;
            timerSeconds = 25 * 60;
            updateTimerDisplay();
        });

        // ========== MOTIVATION ==========
        function setDailyQuote() {
            const random = Math.floor(Math.random() * quotes.length);
            document.getElementById('quote').textContent = `"${quotes[random]}"`;
        }

        document.getElementById('feeling-down').addEventListener('click', () => {
            const random = Math.floor(Math.random() * quotes.length);
            document.getElementById('quote').textContent = `"${quotes[random]}"`;
            
            // Micro-interaction
            const btn = document.getElementById('feeling-down');
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => btn.style.transform = 'scale(1)', 200);
        });

        // ========== MICRO-INTERACTIONS ==========
        function setupEventListeners() {
            document.querySelectorAll('.btn-primary').forEach(btn => {
                btn.addEventListener('mousedown', () => btn.style.transform = 'scale(0.95)');
                btn.addEventListener('mouseup', () => btn.style.transform = 'scale(1)');
                btn.addEventListener('mouseleave', () => btn.style.transform = 'scale(1)');
            });
        }
    </script>
</body>
</html>
